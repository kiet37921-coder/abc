<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt vé Làng Hoa Sa Đéc</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/javacrip.js" defer></script>
</head>
<body>

<header class="hero">
    <h1>ĐĂNG KÝ THAM QUAN</h1>
    <p>Hẹn gặp bạn tại Làng Hoa Sa Đéc</p>
</header>

<nav class="navbar">
    <a href="../index.html">Trang chủ</a>
    <a href="../trangcon/gioithieu.html">Giới thiệu</a>
    <a href="../trangcon/hinhanh.html">Hình ảnh</a>
    <a href="../trangcon/dichvu.html">Dịch vụ</a>
    <a href="../trangcon/datve.html">Đặt vé</a>
</nav>

<main class="page-content">
    <h2>Thông tin đặt vé</h2>

    <form class="booking-form" id="bookingForm">
        <label for="hoten">Họ và tên:</label>
        <input type="text" id="hoten" required
               placeholder="Nhập họ và tên">

        <label for="phone">Số điện thoại:</label>
        <input type="tel" id="phone" required
               pattern="0[0-9]{9}" maxlength="10"
               placeholder="Nhập số điện thoại">

        <label for="service">Dịch vụ:</label>
        <select id="service">
            <option>Vé tham quan vườn hoa</option>
            <option>Vé tham quan nhà vườn</option>
            <option>Xe điện tham quan</option>
            <option>Vé combo tham quan</option>
        </select>

        <label for="people">Số người:</label>
        <select id="people">
            <option>1 người</option>
            <option>2 người</option>
            <option>3 người</option>
            <option>4 người</option>
            <option>5 người</option>
            <option>Trên 5 người</option>
        </select>

        <label for="date">Ngày và giờ đến:</label>
        <input type="datetime-local" id="date" required>

        <label for="note">Yêu cầu khác:</label>
        <textarea id="note" rows="4"
                  placeholder="Nhập yêu cầu của bạn"></textarea>

        <button type="submit">Xác nhận đặt vé</button>
        <button type="reset">Nhập lại</button>

        <p id="message"></p>
    </form>
</main>

<footer>
    <p> Làng Hoa Sa Đéc</p>
    <p>Địa chỉ: TP. Sa Đéc, tỉnh Đồng Tháp</p>
    <P>Điện thoại: 02773.345.678 - 02773.678.999</P>
    <p>Xin chân thành cảm ơn quý khách!</p>
</footer>
</body>
</html>
